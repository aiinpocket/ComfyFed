[build-system]
requires = ["setuptools>=69.5"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyfed"
version = "0.1.18"
description = "ComfyFed worker agent"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
# Runtime deps of the agent. cloud/scripts/build-wheel.mjs reads this list
# (one quoted string per line) to write Requires-Dist into the wheel it builds
# on every deploy -- keep it plain PEP 508 strings, nothing computed.
dependencies = [
  "httpx>=0.27",
  "websockets>=13",
  "pynacl>=1.5",
  "psutil>=6.0",
]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "mcp>=2.0,<3"]
# MCP entry point is optional: the agent self-updates with `pip install
# --no-deps`, so `comfyfed_agent.mcp_server` never imports mcp at module level
# and `comfyfed-mcp` prints guidance and exits 2 when it is missing.
mcp = ["mcp>=2.0,<3"]
[project.scripts]
comfyfed-agent = "comfyfed_agent.main:cli"
# Short alias for the same CLI: what the docs tell users to type
# (`comfyfed pause` / `resume` / `status` / `stop`) and what the installers
# put on PATH.
comfyfed = "comfyfed_agent.main:cli"
comfyfed-mcp = "comfyfed_agent.mcp_server:cli"
[tool.setuptools.packages.find]
where = ["agent"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

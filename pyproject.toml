[build-system]
requires = ["setuptools>=69.5"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyfed"
version = "0.1.15"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "sqlalchemy>=2.0", "alembic>=1.13",
  "pynacl>=1.5", "argon2-cffi>=23.1", "httpx>=0.27", "websockets>=13",
  "python-multipart>=0.0.9", "itsdangerous>=2.2", "psutil>=6.0", "prometheus-client>=0.20",
]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]
# MCP 入口（spec §6.1）：刻意是「選配」，不是硬依賴 -- agent 自更新走
# `pip install --no-deps`，硬依賴根本裝不到，所以 `comfyfed_agent.mcp_server`
# 模組層不 import mcp，缺套件時 `comfyfed-mcp` 印指引並 exit 2。
mcp = ["mcp>=2.0,<3"]
[project.scripts]
comfyfed-server = "comfyfed_server.main:cli"
comfyfed-agent = "comfyfed_agent.main:cli"
# Short alias for the same CLI: what the docs tell users to type
# (`comfyfed pause` / `resume` / `status` / `stop`) and what the installers
# put on PATH.
comfyfed = "comfyfed_agent.main:cli"
# MCP server（`pip install "comfyfed[mcp]"` 後才跑得起來）。
comfyfed-mcp = "comfyfed_agent.mcp_server:cli"
[tool.setuptools.packages.find]
where = ["server", "agent"]
[tool.setuptools]
include-package-data = true
[tool.setuptools.package-data]
# The workflow-template library (index, UI-format workflows, thumbnails and
# the input images templates reference) has to travel inside the wheel --
# `templates.py` locates it with importlib.resources, not a repo path.
comfyfed_server = [
  "templates_data/*.json", "templates_data/*.webp", "templates_data/assets/*",
  "installers/*",
  # The packaged recipes (spec §5.1) -- `recipes.py` locates `recipes/` with
  # importlib.resources, same as the template library above.
  "recipes/*.json",
]
# `panel_ext/` has its own `__init__.py` (unlike `templates_data/`, which has
# none), so setuptools treats it as the subpackage `comfyfed_server.panel_ext`
# and its package-data has to be listed under that name, not the parent's.
# It ships `comfyfed.js`, the extension that hides the dead Comfy-cloud login
# button (see comfyapi.py's `/comfy/api/comfyfed-ext/comfyfed.js` route).
"comfyfed_server.panel_ext" = ["*.js"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
